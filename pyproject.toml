[project]
name = "ag-slg-framework"
version = "0.1.0"
description = "AI Agent driven SLG / Text Adventure Framework based on AG-UI and local Agent CLIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


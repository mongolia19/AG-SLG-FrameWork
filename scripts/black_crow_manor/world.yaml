opening_narration: |
  暴风雨笼罩着荒凉的群山，古老的黑鸦公馆如同一头黑色的巨兽盘踞在悬崖之上。
  你作为调查员亚伦，踏上了通往公馆大门的湿滑石阶……
dm_rules: |

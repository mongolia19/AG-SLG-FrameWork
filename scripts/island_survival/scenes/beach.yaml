    variables:
      found_bottle: true
    attributes_delta:
      stamina: -6
      hydration: -4
      fullness: -4
    time_cost: 1
    message: 你顶着浪花迅速伸手，捞起了一只完好的厚壁玻璃瓶。清洗干净后它是绝佳的储水与煮水容器！
  on_failure:
    attributes_delta:
      stamina: -7
      hydration: -5
      fullness: -4
    time_cost: 1
    message: 浪头打来，脚下一滑险些摔在礁石上，暂时没能抓住漂流物。

id: beach
title: 孤岛沙滩
background: /assets/scenes/island_beach.png
foreground: ''
hero_image: /assets/illustrations/wreckage.png
music: /assets/bgm/ocean_waves.mp3
description: '狂暴的海浪在白色沙滩上留下层层泡沫，海风卷着咸涩的水汽扑面而来。

  你从剧烈的撞击与昏迷中苏醒，身后是一望无际的碧蓝大海，身前则是险峻荒凉的热带岛屿。

  沙滩上散落着失事客机残骸与被冲上岸的浮木残片。烈日悬空，必须尽快寻找物资与生火工具以防夜间失温。

  '
visuals:
  background: /assets/scenes/island_beach.png
  foreground: ''
  hero_image: /assets/illustrations/wreckage.png
  atmosphere: 海浪咆哮、烈日灼烤、危机四伏
  decorations:
  - id: palm_beach
    name: 海风椰林
    image: /assets/props/palmtree.png
    side: left
    caption: 高耸椰树
    tooltip: 海风拂动的椰子树，上面挂满青椰
  - id: crab_beach
    name: 敏捷沙蟹
    image: /assets/props/crab.png
    side: left
    caption: 爬行红蟹
    tooltip: 在潮湿沙滩上飞速爬行的海蟹
  - id: shell_beach
    name: 五彩海贝
    image: /assets/props/seashell.png
    side: right
    caption: 天然贝壳
    tooltip: 潮汐卷上沙滩的坚硬海螺与贝壳
  - id: rock_beach
    name: 潮间黑礁
    image: /assets/props/rocks.png
    side: right
    caption: 海蚀礁石
    tooltip: 被海浪冲刷千百年的火山岩礁石
decorations: []
npcs: []
actions:
- id: pick_seashell
  label: 挑选潮线边缘的大号海螺与贝壳
  type: interact
  target_npc: null
  target_scene: null
  skill: null
  difficulty: null
  condition:
    not_has_item: seashell
  effects: null
  source: null
  on_success:
    gain_item: seashell
    attributes_delta:
      stamina: -3
      hydration: -2
    message: 你从细沙中挖出了一枚泛着珍珠光泽的大海螺与坚硬贝壳，不仅边缘锋利可作切割，螺肉还能应急！
  on_failure: null
- id: pickup_metal_box
  label: 捡起半掩在沙里的防水金属盒，洗去泥沙收好
  type: interact
  target_npc: null
  target_scene: null
  skill: null
  difficulty: null
  condition:
    not_has_item: metal_box
    variables:
      found_metal_box: false
  effects: null
  source: null
  on_success:
    gain_item: metal_box
    variables:
      found_metal_box: true
    attributes_delta:
      stamina: -3
      hydration: -2
    time_cost: 1
    message: 你将半掩在沙里的防水金属盒挖了出来，用海水仔细冲刷掉外壳粘连的泥沙与盐垢后擦干收进背包。厚实的航空铝合金盒体卡扣依然严密，既能当容器储物，也能架在火上烧水。
  on_failure: null
- id: search_luggage
  label: 撬开卡扣，搜查防水金属盒内部
  type: check
  target_npc: null
  target_scene: null
  skill: perception
  difficulty: 10
  condition:
    variables:
      found_lighter: false
  effects: null
  source: null
  on_success:
    gain_item: lighter
    variables:
      found_lighter: true
    attributes_delta:
      stamina: -5
      hydration: -5
      fullness: -4
    time_cost: 1
    message: 你用力撬开金属盒的密封卡扣，在干燥的内衬海绵中发现了一只保存完好的军用防风打火机！机油尚足，火花清脆。
  on_failure:
    attributes_delta:
      stamina: -6
      hydration: -6
      fullness: -4
    time_cost: 1
    message: 盒盖卡扣被盐分咬得很死，费力撬开一条缝隙后里面满是受潮沙砾，暂时没能翻出能用的工具。
- id: scavenge_bottle

id: beach
title: 孤岛沙滩
background: /assets/scenes/island_beach.png
foreground: ''
hero_image: /assets/illustrations/wreckage.png
music: /assets/bgm/ocean_waves.mp3
description: '狂暴的海浪在白色沙滩上留下层层泡沫，海风卷着咸涩的水汽扑面而来。

  你从剧烈的撞击与昏迷中苏醒，身后是一望无际的碧蓝大海，身前则是险峻荒凉的热带岛屿。

  沙滩上散落着失事客机残骸与被冲上岸的浮木残片。烈日悬空，必须尽快寻找物资与生火工具以防夜间失温。

  '

id: coastal_jungle
title: 海边丛林
background: /assets/scenes/coastal_jungle.png
foreground: ''
hero_image: ''
music: /assets/bgm/jungle_breeze.mp3
description: '跨过沙滩上的白沙与碎石，你钻进了茂密的海边林带。

  高耸的椰树与巨大的阔叶灌木遮挡住了刺眼的日光，空气中充斥着植被蒸腾的湿热气息。

  岩石与树干上垂挂着密密麻麻的坚韧藤蔓，地上散落着风折的枯树枝。偶尔能听到林鸟的惊叫，提醒着你未知危险的存在。

  '
visuals:
  background: /assets/scenes/coastal_jungle.png
  foreground: ''
  hero_image: ''
  atmosphere: 林荫昏暗、藤蔓缠绕、湿热沉闷
  decorations:
  - id: palm_jungle
    name: 高耸椰树
    image: /assets/props/palmtree.png
    side: left
    caption: 茂盛椰林
    tooltip: 挡住海风的高耸野生椰子树
  - id: vines_jungle
    name: 悬垂蔓藤
    image: /assets/props/vines.png
    side: right
    caption: 坚韧老藤
    tooltip: 热带雨林中交织生长的粗壮藤蔓
  - id: moss_rocks_jungle
    name: 林地碎石
    image: /assets/props/rocks.png
    side: right
    caption: 青苔滚石
    tooltip: 散落在腐殖土上的苔藓石块
decorations: []
npcs: []
actions:
- id: open_metal_box_coastal
  label: 撬开随身携带的防水金属盒，检查内部暗格
  type: check
  target_npc: null
  target_scene: null
  skill: perception
  difficulty: 9
  condition:
    has_item: metal_box
    variables:
      found_lighter: false
  effects: null
  source: null
  on_success:
    gain_item: lighter
    variables:
      found_lighter: true
    attributes_delta:
      stamina: -3
      hydration: -2
    time_cost: 1
    message: 你借助林间树石撬开洗净的防水金属盒卡扣，竟在防水橡胶垫下发现了一只完好的军用防风打火机！
  on_failure:
    attributes_delta:
      stamina: -4
      hydration: -2
    time_cost: 1
    message: 铝合金卡扣受海盐锈蚀卡得死紧，你暂时没能把盒盖完全撬开。
- id: craft_rope
  label: 割取坚韧古藤与树皮编制耐磨绳索
  type: check
  target_npc: null
  target_scene: null
  skill: survival

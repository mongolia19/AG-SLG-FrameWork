      stamina: -8
      hydration: -6
      fullness: -5
    time_cost: 1
    message: 你熟练地抽离藤皮纤维，绞合编织出一捆长约五米、承重坚固的耐磨手工绳！
  on_failure:
    attributes_delta:
      stamina: -7
      hydration: -5
      fullness: -4
    time_cost: 1
    message: 选中的藤条过于脆弱，用力一拉就断裂了，需要重新寻找韧性更好的老藤。

id: deep_jungle
title: 丛林深处
background: /assets/scenes/deep_jungle.png
foreground: ''
hero_image: /assets/illustrations/campfire.png
music: /assets/bgm/deep_woods.mp3
description: '光线在此处骤然暗淡，遮天蔽日的百年古木将天际分割成细碎的绿斑。

  空气中弥漫着潮湿的腐殖土气味，远处岩壁下方隐约传来清澈的溪流叮咚声。

  古树干上留有野兽撕挠的新鲜爪印，林间雾气缓缓升腾。若能在夜晚降临前在此生起一堆篝火并取得淡水，将大大提升生存概率。

  '
visuals:
  background: /assets/scenes/deep_jungle.png
  foreground: ''
  hero_image: /assets/illustrations/campfire.png
  atmosphere: 古木森森、幽暗潮湿、溪流潺潺
  decorations:

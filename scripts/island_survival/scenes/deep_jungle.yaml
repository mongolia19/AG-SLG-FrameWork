    time_cost: 1
    message: 你在青苔覆盖的泉眼边先痛饮几口，再将厚壁玻璃瓶盛满清冽泉水！这彻底解除了脱水的致命威胁。
  on_failure:
    attributes_delta:
      stamina: -6
      fullness: -3
    time_cost: 1
    message: 水流急促混杂着山洪泥沙，未能找到澄清的直接饮用源头。
- id: drink_stream_directly

    name: 遮天绞杀藤
    image: /assets/props/vines.png
    side: left
    caption: 遮天古藤
    tooltip: 自雨林树冠垂垂而下的粗壮巨藤
  - id: rocks_deep
    name: 溪涧苔藓卵石
    image: /assets/props/rocks.png
    side: right
    caption: 溪涧苔石
    tooltip: 清冽山泉浸润冲刷的深色玄武岩石
decorations: []
npcs: []
actions:
- id: open_metal_box_in_jungle
  label: 撬开随身携带的防水金属盒，搜查内部夹层
  type: check
  target_npc: null
  target_scene: null
  skill: perception
  difficulty: 9
  condition:
    has_item: metal_box
    variables:
      found_lighter: false
  effects: null
  source: null
  on_success:
    gain_item: lighter
    variables:
      found_lighter: true
    attributes_delta:
      stamina: -3
      hydration: -2
    time_cost: 1
    message: 你在溪边用卵石磕松了防水金属盒的卡扣，打开盒盖后在干燥的防震内衬里找到了一只军用防风打火机！
  on_failure:
    attributes_delta:
      stamina: -4
      hydration: -2
    time_cost: 1
    message: 金属盒卡扣咬合得非常严密，徒手一时没能完全撬开。
- id: boil_water_in_metal_box
  label: 用防水金属盒盛满溪水，架在篝火上煮沸杀菌
  type: interact
  target_npc: null
  target_scene: null
  skill: null
  difficulty: null
  condition:

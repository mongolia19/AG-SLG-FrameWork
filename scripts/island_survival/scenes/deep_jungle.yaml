      stamina: 8
      temperature: 1
    san_delta: 4
    time_cost: 1
    message: 你将洗净的铝合金防水盒充当简易煮水壶，盛满溪水架在篝火余烬上烧开。温热的沸水消除了寄生虫隐患，你痛快喝下并感到浑身舒畅！
  on_failure: null
- id: craft_stone_blade

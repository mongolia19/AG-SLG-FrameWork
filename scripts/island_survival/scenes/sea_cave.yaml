    gain_item: branches
    attributes_delta:
      stamina: -3
      hydration: -1
    time_cost: 1
    message: 你在远离海浪的高处岩架摸到了一捆存放已久的干燥木柴，即使外面阴雨连绵也依然干爽易燃！

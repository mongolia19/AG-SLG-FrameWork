id: sea_cave
title: 海蚀避风岩洞
background: /assets/scenes/island_beach.png
foreground: ''
hero_image: /assets/props/rocks.png
music: /assets/bgm/ocean_waves.mp3
description: '沿着沙滩北侧潮湿的玄武岩礁攀行片刻，岩壁下方豁然出现一处天然形成的海蚀岩洞。

  厚实的火山岩穹顶将炽热日光、狂风与暴雨牢牢挡在洞外，洞内虽略显幽暗阴凉，却保留着难得的干燥地面。

  岩壁高处的石缝偶尔渗出清冽山泉滴水，洞口望出去恰好能俯瞰整片海湾的风云变幻，是荒岛上绝佳的天然避风港。

  '
visuals:
  background: /assets/scenes/island_beach.png
  foreground: ''
  hero_image: /assets/props/rocks.png
  atmosphere: 岩壁幽凉、遮风避雨、潮声回荡
  decorations:
  - id: cave_rocks
    name: 海蚀玄武岩壁
    image: /assets/props/rocks.png
    side: left
    caption: 天然岩洞
    tooltip: 厚实坚固的海蚀岩壁，能完美抵御海岛狂风与暴风雨
  - id: cave_shells
    name: 潮汐海螺堆
    image: /assets/props/seashell.png
    side: right
    caption: 岩缝贝壳
    tooltip: 高潮位涨水时留在洞口岩隙中的海螺与贝壳
  - id: built_campfire
    name: 岩洞篝火
    image: /assets/illustrations/campfire.png
    side: right
    caption: 避风火堆
    tooltip: 在岩洞深处生起的稳定篝火，不受洞外狂风暴雨侵扰
  - id: built_water_collector
    name: 岩壁接水器
    image: /assets/props/water_collector.png
    side: left
    caption: 滴水收集
    tooltip: 承接岩壁渗水与洞口雨水的持续淡水装置
decorations: []
npcs: []

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bgCrit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#172b4d"/>
    </linearGradient>
    <linearGradient id="critGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="14" fill="url(#bgCrit)"/>
  <rect x="6" y="6" width="308" height="228" rx="11" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Top-left Energy Cost Badge -->
  <rect x="14" y="14" width="84" height="32" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="56" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">⚡ 1 能量</text>

  <!-- Top-right Attack Damage Badge -->
  <rect x="218" y="14" width="88" height="32" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="262" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">⚔ 0 伤害</text>

  <!-- Center Optical Prism: 3 inputs -> 1 focused beam -->
  <circle cx="160" cy="108" r="46" fill="url(#critGlow)" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="104" y1="90" x2="142" y2="104" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="104" y1="108" x2="138" y2="108" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="104" y1="126" x2="142" y2="112" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.8"/>
  <polygon points="160,72 190,132 130,132" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
  <line x1="176" y1="108" x2="220" y2="108" stroke="#fde047" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Card Name & Effect -->
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">批判思维</text>
  <text x="160" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#bfdbfe">抽 3 张留 1 张 · 弃 2 张</text>
</svg>

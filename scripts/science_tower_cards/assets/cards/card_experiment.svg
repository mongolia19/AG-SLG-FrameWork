  <circle cx="160" cy="108" r="46" fill="url(#flaskGlow)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M146 72 L174 72 M150 72 L150 92 L128 134 Q124 142 133 142 L187 142 Q196 142 192 134 L170 92 L170 72" fill="#0f2942" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
  <path d="M135 122 L185 122 L190 135 Q192 139 186 139 L134 139 Q128 139 130 135 Z" fill="#fb7185" fill-opacity="0.75"/>
  <path d="M104 108 L126 108 L134 96 L142 120 L150 108 L170 108 L178 94 L186 120 L194 108 L216 108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Card Name & Effect -->

  </defs>
  <rect width="320" height="240" rx="14" fill="url(#bgExp)"/>
  <rect x="6" y="6" width="308" height="228" rx="11" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>


<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bgInd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112e"/>
      <stop offset="1" stop-color="#281c54"/>
    </linearGradient>
    <linearGradient id="indGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="14" fill="url(#bgInd)"/>
  <rect x="6" y="6" width="308" height="228" rx="11" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Top-left Energy Cost Badge -->
  <rect x="14" y="14" width="84" height="32" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="56" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">⚡ 2 能量</text>

  <!-- Top-right Attack Damage Badge -->
  <rect x="218" y="14" width="88" height="32" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="262" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">⚔ 0 伤害</text>

  <!-- Center Causal Nodes & Amplification Arrow -->
  <circle cx="160" cy="108" r="46" fill="url(#indGlow)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="126" y1="128" x2="160" y2="96" stroke="#c4b5fd" stroke-width="2.5"/>
  <line x1="194" y1="128" x2="160" y2="96" stroke="#c4b5fd" stroke-width="2.5"/>
  <line x1="160" y1="96" x2="160" y2="70" stroke="#ddd6fe" stroke-width="3"/>
  <path d="M150 80 L160 68 L170 80" fill="none" stroke="#ddd6fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="128" r="9" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2.5"/>
  <circle cx="194" cy="128" r="9" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2.5"/>
  <circle cx="160" cy="96" r="11" fill="#6d28d9" stroke="#f5f3ff" stroke-width="2.5"/>

  <!-- Card Name & Effect -->
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">归纳法</text>
  <text x="160" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ddd6fe">下一次「实验」伤害 +4</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bgVer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071e22"/>
      <stop offset="1" stop-color="#0f3a3e"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="14" fill="url(#bgVer)"/>
  <rect x="6" y="6" width="308" height="228" rx="11" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Top-left Energy Cost Badge -->
  <rect x="14" y="14" width="84" height="32" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="56" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">⚡ 1 能量</text>

  <!-- Top-right Attack Damage Badge -->
  <rect x="218" y="14" width="88" height="32" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="262" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">⚔ 0 伤害</text>

  <!-- Center Geometric Shield & Check -->
  <circle cx="160" cy="108" r="46" fill="url(#shieldGlow)" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M160 68 L194 82 L194 110 C194 132 176 144 160 150 C144 144 126 132 126 110 L126 82 Z" fill="#0d2e33" stroke="#5eead4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M145 108 L156 119 L177 96" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card Name & Effect -->
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">校验</text>
  <text x="160" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#99f6e4">获得 5 点护盾 · 稳固防线</text>
</svg>

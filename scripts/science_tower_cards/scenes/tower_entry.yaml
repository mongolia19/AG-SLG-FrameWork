npcs: []

actions:
  - id: "inspect_rulebook"
    label: "【检视】阅读塔规与初始卡组"
    type: "interact"
    on_success:
      visuals:
        foreground: ""
        hero_image: "/assets/illustrations/tower_entry_hero.svg"
      message: |
        塔规检台亮起：
        1. 每回合能量重置为 5，并抽至 5 张手牌。
        2. 出牌立即结算，耗尽能量即停止。
        3. 出牌结束后，若敌人仍存活，敌人反击一次。
        4. 初始卡组为 3×实验、3×校验、1×归纳法、1×批判思维。
  - id: "enter_first_encounter"
    label: "【开局】进入首层遭遇：未知"
    type: "transition"
    target_scene: "encounter_unknown"
    on_success:
      transition_scene: "encounter_unknown"
      variables:
        tower_stage: "layer1"
        current_encounter: "encounter_unknown"
        enemy_name: "未知"
        enemy_hp: 36
        enemy_max_hp: 36
        enemy_armor: 0
        enemy_alive: true
        turn_count: 0
        energy: 5
        shield: 0
        induction_bonus: 0
      visuals:
        foreground: ""
        hero_image: ""
      message: |
        下行道在冷光中开启。第一个身影在通道尽头成形，它的轮廓尚未被任何实验定义。
        你握紧八张初始卡牌，走向首层遭遇【未知】。

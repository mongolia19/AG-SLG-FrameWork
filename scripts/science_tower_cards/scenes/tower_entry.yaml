id: "tower_entry"
title: "实验塔 · 首层门厅"
background: "/assets/scenes/tower_entry.svg"
foreground: ""
hero_image: "/assets/illustrations/tower_entry_hero.svg"
music: "/assets/bgm/tower_entry.mp3"

description: |
  乳白色的荧光导管在环形阶梯之间缓缓流转，像一条被驯服的电流。
  你面前的悬浮检台陈列着八张写满公式的实验卡，空气里浮着冷却金属与干燥纸页的味道。
  每一步向下，塔层都会向你确认一次逻辑是否足够坚实。


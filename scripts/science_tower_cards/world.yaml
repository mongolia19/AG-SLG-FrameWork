id: "science_tower_cards"
title: "实验之塔 · 自然科学卡牌试炼"
version: "0.2.0"
author: "AG-SLG Studio Co-pilot"
icon: "⚗️"
sort_order: 30
initial_scene: "tower_entry"
opening_narration: |
  洁白的实验塔在地底深处静默旋转。你作为唯一的物理学家，带着八张由逻辑写成的研究卡牌，
  即将沿塔层向下推进。每一层都由成双的概念守护，击败它们可从四张掉落卡牌中挑选两张加入卡组；
  而在塔心最深处等待你的，是身披尖刺外壳的最终主宰——「神学」。
dm_rules: |
  - 【核心铁律 · 严禁口头估算】：
    所有卡牌出牌、抽牌、弃牌、伤害、护盾、尖刺反伤与敌方反击，都必须先用
    `scripts/science_tower_cards/scripts/card_engine.py --json '{...}'` 计算出精确结果，
    再把脚本返回的 `state_delta` 原样写入叙事末尾。不要凭印象加减血量或改牌堆。
  - 【回合流程】：
    1. 每回合开始时能量重置为 5，从牌堆补抽至 5 张手牌；若牌堆耗尽，则将弃牌堆洗回牌堆。
    2. 玩家按任意顺序打出若干张手牌（攻击牌可指定目标 `target: 1 | 2`）；每张牌立即结算并消耗对应能量。
    3. 所有出牌结算完成后，场上仍存活的敌人依次执行一次确定性反击。
    4. 反击结束后进入下一回合，继续抽牌与出牌循环。
  - 【基础卡牌 · 初始 8 张】：
    - 实验：1 能量，攻击 6；若有归纳增益则追加（最高 +12）并清空增益。
    - 校验：1 能量，攻击 0，获得 5 点护盾。
    - 归纳法：2 能量，攻击 0，下一次「实验」伤害 +4（单回合最高 +12）。
    - 批判思维：1 能量，攻击 0，抽 3 张保留 1 张入手，其余 2 张进弃牌堆。
  - 【第一层双敌同场 · 未知 & 无知】：
    - 未知（HP 36，防御 0）：反击造成 6 点伤害，并使下一回合「实验」伤害 -1（最多 -2）。战后掉落：假设检验、控制变量。
    - 无知（HP 44，防御 3）：反击造成 4 点伤害，但使你下一次「校验」护盾 +1。战后掉落：精密测量、双倍校验。
    - 战后四选二：击败未知与无知后，玩家从 4 张掉落卡牌中任选 2 张加入卡组。
  - 【第二层双敌同场 · 盲从 & 谬证】：
    - 盲从（HP 60，初始防御 0）：反击造成 5 点伤害，若玩家回合末仍持有归纳增益，则复制并使自身防御 +2 且清空玩家归纳增益。战后掉落：反证法、证伪重击。
    - 谬证（HP 68，防御 0）：反击造成 7 点伤害，并移除玩家最左侧 1 张手牌。战后掉落：严密公理、奥卡姆剃刀。
    - 战后四选二：击败盲从与谬证后，玩家从 4 张掉落卡牌中任选 2 张加入卡组。
  - 【最终 Boss · 神学】：
    - 神学（HP 96，防御 1）：拥有被动「尖刺外壳」——每次受到玩家攻击卡牌伤害后，立即对攻击者反伤 3 点（护盾优先抵挡，剩余扣减生命）；回合末反击造成 9 点伤害。
  - 【视觉铁律】：
    每个遭遇场景都使用真实背景图与焦点插画，`visuals.foreground` 保持为空。
    左侧边栏在展示角色「物理学家」的同时，依据 `hand_card_1` ~ `hand_card_5` 自动展示当前持有的手牌（含攻击伤害与消耗能量）；
    右侧边栏实时展示当前存活的敌方角色卡。


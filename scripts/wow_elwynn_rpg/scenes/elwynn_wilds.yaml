id: "elwynn_wilds"
title: "野外 · 艾尔文密林与哨岗"
background: "/assets/scenes/elwynn_wilds.svg"
foreground: ""
hero_image: "/assets/illustrations/elwynn_wilds_hero.svg"
music: "/assets/bgm/elwynn_forest.mp3"

description: |
  踏出北郡山谷，参天古树交织成一片幽深而壮丽的艾尔文密林。阳光穿过茂密的橡树枝叶，在铺满苔藓的石径上投下斑驳光影。
  林间并不平静——饥饿的艾尔文森林灰狼在灌木后游曳，佩戴红色面罩的迪菲亚劫掠者也在附近扎营窥伺。
  路旁一处隐蔽的木制哨岗下，巡林者艾莲娜·迅箭正蹲身检查地面残留的黑色蛛丝与腐蚀毒液。前方山坡下便是被狗头人与护卫蛛占领的【法戈第矿洞外围坑道】，必须清剿林间威胁、突破 Lv.3 并调配抗毒合剂，才能从容迎战洞窟深处的强敌！

visuals:
  background: "/assets/scenes/elwynn_wilds.svg"
  foreground: ""
  hero_image: "/assets/illustrations/elwynn_wilds_hero.svg"
  atmosphere: "林涛沙沙、危机暗伏、战意升腾"
  decorations:

      tooltip: "【定位】红面罩迪菲亚强盗小队 ｜【血量】130 HP（实时见顶栏野外敌军面板）｜【属性】闪避 DC 11 / 攻击加值 +3 ｜【技能】致盲飞沙与淬毒短匕（基础 18 伤 + 2 毒伤）｜【掉落】银叶解毒草与 35 金币"
      condition:

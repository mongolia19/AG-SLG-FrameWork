decorations: []

npcs: []

actions:
  - id: "talk_elena_coop"
    label: "【结伴合作】招募巡林者艾莲娜入队（记录同伴属性与 4 项技能，共赴矿洞）"
    type: "interact"
    condition:
      variables:
        ally_recruited: false
    on_success:
      gain_item: "照明信号箭"
      variables:
        ally_recruited: true
        ally_level: 2
        ally_hp: 110
        ally_max_hp: 110
        ally_mp: 90
        ally_max_mp: 90
        ally_agility: 15
        ally_perception: 14
        ally_constitution: 12
        ally_defense: 5
        ally_status: "协同作战"
        ally_mark_active: false
        ally_web_trapped: false
        ally_last_action: "正式入队 · 赠予【照明信号箭】"
      hud_widgets:
        - id: "ally_elena_panel"
          type: "panel"
          title: "随行同伴 · 巡林者艾莲娜·迅箭"
          icon: "🏹"
          tone: "emerald"
          when:
            variables:
              ally_recruited: true
          badges:
            - text_ref: "Lv.{variables.ally_level} 游侠"
              tone: "emerald"
            - text_ref: "敏{variables.ally_agility} / 感{variables.ally_perception} / 体{variables.ally_constitution} / 甲-{variables.ally_defense}"
              tone: "slate"
            - text_ref: "状态: {variables.ally_status}"
              tone: "sky"
            - text: "🎯 猎人印记生效(全队检定+2/伤×1.15)"
              tone: "amber"
              when:
                variables:
                  ally_mark_active: true
            - text: "⚠ 蛛网受困(检定-2)"
              tone: "purple"
              when:
                variables:
                  ally_web_trapped: true
            - text: "💀 重伤力竭(需救援)"
              tone: "danger"
              when:
                variables:
                  ally_hp:
                    lte: 0
            - text_ref: "最近行动: {variables.ally_last_action}"
              tone: "slate"
          bars:
            - label: "艾莲娜血量"
              value_ref: "variables.ally_hp"
              max_ref: "variables.ally_max_hp"
              color: "emerald"
            - label: "艾莲娜集中值"
              value_ref: "variables.ally_mp"
              max_ref: "variables.ally_max_mp"
              color: "sky"
          cards_title: "查看随行NPC技能与规则"
          cards:
            - title: "迅捷连射 (15 集中值 · 敏捷判定)"
              desc: "伤害 = ceil((16 + 敏捷×2.0 + 同伴等级×8) × 破甲 × 印记 × 判定倍率)，稳定压低敌方血线。"
              tone: "emerald"
            - title: "猎人印记·照明破绽 (20 集中值 · 感知判定)"
              desc: "伤害 = ceil((12 + 感知×1.5) × 破甲 × 判定倍率)，削敌 15 MP 并置全队检定 +2、伤害 ×1.15。"
              tone: "amber"
            - title: "冰霜震荡箭 (25 集中值 · 感知判定)"
              desc: "伤害 = ceil((14 + 敏捷×1.8 + 等级×6) × 破甲 × 印记 × 判定倍率)，打断敌方蓄力(-30/-20 MP)或击杀 1 只幼蛛。"
              tone: "sky"
            - title: "森林草药急救 / 稳步平射回气 (15 / 0 集中值)"
              desc: "急救：为伤重队友恢复 25+感知 HP 并解网；集中<15 时强制 0 耗蓝平射(10+敏捷)并回气 +20 集中值。"
              tone: "purple"
          footer: "全员互攻规则：每回合须独立判定【主角 → 艾莲娜 → 敌方全员】；艾莲娜回避 DC=10+敏捷修正，承伤减免 ally_defense(圣骑士光环再-2)；HP归零力竭失去协同。"
      visuals:
        foreground: ""
        hero_image: "【小队结盟】巡林者艾莲娜·迅箭正式入队（Lv.2 · 110 HP / 90 集中值），全员技能已登记"
      message: "艾莲娜检查完弓弦与箭袋，正式与你结伴同行（Lv.2 · 110 HP / 90 集中值 · 敏15/感14/体12/甲-5），并登记随行技能【迅捷连射】【猎人印记·照明破绽】【冰霜震荡箭】【森林草药急救】！她递给你一支【照明信号箭】：‘之后每一场战斗我都会独立判定出手与分担敌火，咱们严格配合！’"

  - id: "hunt_elwynn_prowler"
    label: "【野外战斗 · 全员互攻】清剿艾尔文森林灰狼群（敌 110 HP · 消耗 20 MP）"
    type: "check"
    skill: "agility"
    difficulty: 11
    condition:
      min_hp: 1
      min_mp: 20
      variables:
        wilds_wolf_cleared: false
    on_success:
      gain_item: "优质狼皮"
      hp_delta: -12
      mp_delta: -20
      variables:
        wilds_wolf_cleared: true
        wilds_wolf_hp: 0
        xp: 220
        ally_last_action: "迅捷连射(-15集中)协同猎杀头狼"
      variables_delta:
        ally_hp: -8
        ally_mp: -15
      visuals:
        foreground: ""
        hero_image: "【荒野狩猎】主角与同伴协同判定，狼群在连招与箭雨下溃散"
      message: "战斗按全员回合严格结算：你消耗 20 MP 命中头狼并承受撕咬反击（HP -12，MP -20）；随行艾莲娜同步施放【迅捷连射】消耗 15 集中值补伤并格挡侧袭（艾莲娜 HP -8，集中 -15），彻底击溃 110 HP 森林灰狼群！收获【优质狼皮】，XP 提升至 220。"
    on_failure:
      hp_delta: -20
      mp_delta: -15
      variables:
        ally_last_action: "迅捷连射擦伤并替你掩护侧翼"
      variables_delta:
        ally_hp: -12
        ally_mp: -15
      message: "先手检定受挫！灰狼群借林影反扑分别扑咬你与侧翼掩护的艾莲娜（你 HP -20、MP -15；艾莲娜 HP -12、集中 -15），双方稳住阵型后可重新迎战。"

  - id: "clear_defias_camp"
    label: "【野外战斗 · 全员互攻】清剿迪菲亚强盗小队（敌 130 HP · 消耗 25 MP）"
    type: "check"
    skill: "strength"
    difficulty: 11
    condition:
      min_hp: 1
      min_mp: 25
      variables:
        wilds_defias_cleared: false
    on_success:
      gain_item: "银叶解毒草"
      gold_delta: 35
      hp_delta: -15
      mp_delta: -25
      variables:
        wilds_defias_cleared: true
        wilds_defias_hp: 0
        xp: 320
        ally_last_action: "猎人印记(-20集中)锁敌破防"
      variables_delta:
        ally_hp: -10
        ally_mp: -20
      visuals:
        foreground: ""
        hero_image: "【战利品特写】迪菲亚营地缴获的银叶解毒草与钱袋"
      message: "全员互攻严格结算：你消耗 25 MP 正面突入迪菲亚营地（承受淬毒短匕反击 HP -15，MP -25）；艾莲娜施放【猎人印记】锁定盗贼头目（消耗 20 集中值，承受飞沙流箭 HP -10），协同击溃 130 HP 强盗小队！缴获【银叶解毒草】与 35 金币（XP 达 320，可突破 Lv.3！）。"
    on_failure:
      hp_delta: -22
      mp_delta: -15
      variables:
        ally_last_action: "掩护撤退并承受飞沙反击"
      variables_delta:
        ally_hp: -14
        ally_mp: -15
      message: "迪菲亚盗贼反手掷出致盲飞沙并挥匕猛刺，判定命中你与艾莲娜（你 HP -22、MP -15；艾莲娜 HP -14、集中 -15）。整理架势后可再次进攻。"

  - id: "wilds_rest_recover"
    label: "【哨岗全队调息】与随行同伴在木哨岗休整（主角 HP+25/MP+35 · 艾莲娜 HP+25/集中+30）"
    type: "interact"
    condition:
      min_hp: 1
    on_success:
      hp_delta: 25
      mp_delta: 35
      variables:
        ally_status: "协同作战"
        ally_web_trapped: false
        ally_last_action: "哨岗调息包扎与补充箭矢"
      variables_delta:
        ally_hp: 25
        ally_mp: 30
      message: "你与艾莲娜背靠古橡树在哨岗短暂包扎、调息与清点箭囊（主角 HP +25 / MP +35；艾莲娜 HP +25 / 集中值 +30）。"

  - id: "brew_cave_antidote"
    label: "【战前整备】用【银叶解毒草】调配矿洞专用抗毒合剂"
    type: "interact"
    condition:
      has_item: "银叶解毒草"
      variables:
        antidote_prepared: false
    on_success:
      consume_item: "银叶解毒草"
      remove_inventory:
        - "银叶解毒草"
      gain_item: "抗毒合剂"
      variables:
        antidote_prepared: true
      message: "在艾莲娜的草药学指导下，你将银叶草碾碎熬制，封装成一瓶碧绿澄澈的【抗毒合剂】，在Boss战饮用可固定减免每次 6 点毒伤并获得 +1 检定修正。"

  - id: "upgrade_to_lv3"
    label: "【全队等级突破 Lv.2 → Lv.3】总结实战经验（主角与艾莲娜同步晋升 Lv.3）"
    type: "interact"
    condition:
      variables:
        level: 2
        wilds_wolf_cleared: true
        wilds_defias_cleared: true
    on_success:
      max_hp_delta: 25
      max_mp_delta: 25
      hp_delta: 50
      mp_delta: 50
      san_delta: 8
      attributes_delta:
        strength: 3
        agility: 3
        intelligence: 3
        constitution: 3
        perception: 2
      variables:
        level: 3
        xp: 320
        xp_next: 700
        skill_rank: 3
        skills: "核心职业技能全员晋升至 Lv.3（伤害与法力上限大幅成长）"
        ally_level: 3
        ally_max_hp: 130
        ally_hp: 130
        ally_max_mp: 110
        ally_mp: 110
        ally_agility: 17
        ally_perception: 16
        ally_constitution: 14
        ally_defense: 6
        ally_status: "Lv.3 协同就绪"
        ally_last_action: "同步突破至 Lv.3（130 HP / 110 集中值）"
      visuals:
        foreground: ""
        hero_image: "【全队等级跃升】主角与巡林者艾莲娜同步突破至 Lv.3，属性与技能威力全面跃升！"
      message: "经历艾尔文荒野的连续恶战，你与巡林者艾莲娜双双完成蜕变！主角晋升【Lv.3】（MaxHP/MaxMP +25，全属性增长，技能 Lv.3）；随行同伴艾莲娜同步晋升【Lv.3】（130 HP / 110 集中值 / 敏17 / 感16 / 体14 / 防御减伤6）！"

  - id: "drink_healing_potion_wilds"
    label: "饮用【初级治疗药水】恢复生命值（HP +45）"
    type: "interact"
    condition:
      has_item: "初级治疗药水"
    on_success:
      consume_item: "初级治疗药水"
      remove_inventory:
        - "初级治疗药水"
      hp_delta: 45
      message: "你拔开红药水瓶塞一饮而尽，森林间的疲惫与爪伤迅速愈合（HP +45）。"

  - id: "drink_mana_potion_wilds"
    label: "饮用【初级法力药水】恢复魔法值（MP +55）"
    type: "interact"
    condition:
      has_item: "初级法力药水"
    on_success:
      consume_item: "初级法力药水"
      remove_inventory:
        - "初级法力药水"
      mp_delta: 55
      message: "甘冽的法力药剂瞬间充盈魔力经络，你的施法与战意重回巅峰（MP +55）。"

  - id: "enter_fargodeep_entrance"
    label: "沿山坡木轨深入，前往【矿洞前哨 · 法戈第外围坑道】（Boss 前小怪守卫战）"
    type: "transition"
    target_scene: "fargodeep_entrance"
    on_success:
      variables:
        ally_mark_active: false
        ally_web_trapped: false
      remove_hud_widgets:
        - "wilds_enemies_panel"
      hud_widgets:
        - id: "fargodeep_vanguard"
          type: "tracker"
          title: "Boss 前哨小怪守卫战（全员互攻）"
          icon: "⚔️"
          when:
            variables:
              cave_vanguard_cleared: false
          steps:
            - label: "① 狗头人矿工与工头 (140 HP / 60 MP)"
              done_when:
                variables:
                  cave_kobolds_cleared: true
              active_when:
                variables:
                  cave_kobolds_cleared: false
            - label: "② 精英护卫蛛群 (180 HP / 80 MP)"
              done_when:
                variables:
                  cave_spiders_cleared: true
              active_when:
                variables:
                  cave_kobolds_cleared: true
                  cave_spiders_cleared: false
            - label: "🔓 蜘蛛领主主巢穴"
              done_when:
                variables:
                  cave_vanguard_cleared: true
        - id: "vanguard_enemies_panel"
          type: "panel"
          title: "前哨敌军实时血蓝状态"
          icon: "🔥"
          tone: "danger"
          when:

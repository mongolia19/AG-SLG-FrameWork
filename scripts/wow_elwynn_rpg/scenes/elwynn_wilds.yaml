      caption: "精灵斥候 · 可招募入队"
      tooltip: "【定位】艾尔文哨岗精灵游侠（待招募）｜【血量】110/110 HP ｜【入队收益】解锁随行同伴实时面板与照明信号箭 ｜【技能】迅捷连射 / 猎人印记 / 冰霜震荡箭 / 森林草药急救"
      condition:

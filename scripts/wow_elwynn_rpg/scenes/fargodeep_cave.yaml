        - "狗头人火油炸药"
      hp_delta: -6
      variables:
        boss_armor_broken: true
        boss_web_trapped: false
        boss_minions: 0
      variables_delta:
        boss_hp: -55
        boss_mp: -25
        combat_round: 1
      visuals:
        hero_image: "【火油爆破】烈焰轰开紫黑硬壳，同时烧净场内幼蛛与蛛网！"
      message: "轰隆巨响震彻矿洞！火油炸药在蜘蛛领主腹下炸开（Boss HP -55，Boss MP -25），硬化甲壳瞬间龟裂暴露，场上的幼蛛与缠身蛛网一并化为灰烬！"

  - id: "shatter_boss_armor"
    label: "【强攻破甲】聚焦腹甲裂隙强行重击破甲（消耗 20 MP）"

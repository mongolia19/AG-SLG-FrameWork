actions:
  - id: "engage_boss_arachnos"
    label: "【唤醒 Boss 战 · 全员回合互攻】锁定蜘蛛领主·阿拉克诺斯，展开严格规则决战！"
    type: "interact"
    condition:
      min_hp: 1
      variables:
        boss_active: false
        boss_defeated: false
    on_success:
      variables:
        boss_active: true
        boss_name: "蜘蛛领主·阿拉克诺斯"
        boss_hp: 360
        boss_max_hp: 360
        boss_mp: 180
        boss_max_mp: 180
        boss_phase: 1
        boss_armor_broken: false
        boss_web_trapped: false
        boss_minions: 0
        ally_mark_active: false
        ally_web_trapped: false
        ally_status: "Boss 战协同就绪"
        ally_last_action: "搭箭锁定阿拉克诺斯，准备独立回合出手"
        combat_round: 1
        boss_casting: "【阶段一】甲壳硬化（减伤45%）· 伺机蛛网茧缚（30MP）"
      visuals:
        foreground: ""
        hero_image: "【Boss 战开启】蜘蛛领主·阿拉克诺斯发出嘶鸣，360HP/180MP 压迫降临！"
      remove_hud_widgets:
        - "fargodeep_vanguard"
        - "vanguard_enemies_panel"
      hud_widgets:
        - id: "arachnos_boss_panel"
          type: "panel"
          title: "蜘蛛领主·阿拉克诺斯"
          tone: "danger"
          when:
            variables:
              boss_active: true
              boss_defeated: false
          badges:
            - text_ref: "阶段 {variables.boss_phase}/3"
              tone: "amber"
            - text: "✓ 软甲已暴露"
              tone: "emerald"
              when:
                variables:
                  boss_armor_broken: true
            - text: "🛡 甲壳硬化"
              tone: "danger"
              when:
                variables:
                  boss_armor_broken: false
            - text_ref: "毒囊幼蛛 ×{variables.boss_minions}"
              tone: "amber"
              when:
                variables:
                  boss_minions:
                    gt: 0
            - text: "⚠ 蛛网茧缚中"
              tone: "purple"
              when:
                variables:
                  boss_web_trapped: true
            - text_ref: "意图: {variables.boss_casting}"
              tone: "sky"
          bars:
            - label: "Boss 血量"
              value_ref: "variables.boss_hp"
              max_ref: "variables.boss_max_hp"
              color: "rose"
            - label: "Boss 魔法"
              value_ref: "variables.boss_mp"
              max_ref: "variables.boss_max_mp"
              color: "violet"
          cards_title: "查看Boss技能"
          cards:
            - title: "甲壳硬化 (被动/减伤45%)"
              desc: "未破甲前全队伤害 ×0.55，需合作照明箭、火油炸药或强攻破甲。"
              tone: "danger"
            - title: "蛛网茧缚 (30MP · 单体16伤)"
              desc: "攻击主角或艾莲娜（受击者检定-2、易伤+5），需及时挣脱或火攻烧断。"
              tone: "purple"
            - title: "召唤毒囊幼蛛 (35MP · 40HP×2)"
              desc: "二阶段孵化2只幼蛛协同撕咬，每只每回合追加+4毒伤并令全队检定-1。"
              tone: "amber"
            - title: "剧毒新星 (40MP · 全体AOE 34毒伤)"
              desc: "高伤全体毒爆蓄力，须对主角与艾莲娜分别判定承伤，可提前打断削蓝。"
              tone: "fuchsia"
            - title: "深渊狂暴·暗影毒潮 (45MP · 全体40伤-15MP)"
              desc: "三阶段重铸硬壳并引爆全体毒潮，同时吸取主角与艾莲娜 15 MP/集中值。"
              tone: "red"
          footer: "全员互攻铁律：每回合按【主角 → 艾莲娜 → Boss/幼蛛】独立投骰与公式结算 | 主角伤=(基础+主属性×2.5+级×10)×破甲×印记×倍率 | 艾莲娜伤=(基础+主属性×2.0+级×8)×破甲×印记×倍率 | Boss MP<30 枯竭普攻并+35MP | 印记+2检定/×1.15伤"
      message: "蜘蛛领主·阿拉克诺斯猛地从岩台跃起（360 HP / 180 MP）！全员回合制 Boss 战打响：每回合都将严格结算【主角行动 → 随行同伴艾莲娜独立行动 → Boss 与幼蛛反击】的投骰判定与伤害扣减！"

  - id: "use_antidote_before_boss"
    label: "【战前/战中准备】饮用【抗毒合剂】（HP +30 / MP +20，常驻减免6点毒伤）"
    type: "interact"
    condition:
      has_item: "抗毒合剂"
      min_hp: 1
      variables:
        boss_defeated: false
    on_success:
      consume_item: "抗毒合剂"
      remove_inventory:
        - "抗毒合剂"
      hp_delta: 30
      mp_delta: 20
      attributes_delta:
        constitution: 2
      variables:
        antidote_active: true
      message: "清凉的草药灵流流遍全身（HP +30，MP +20，体质 +2），你获得【抗毒护佑】：Boss 每次毒系攻击伤害减免 6 点，检定额外 +1！"

  - id: "coop_clear_webs"
    label: "【合作破甲】消耗【照明信号箭】协同艾莲娜击碎 Boss 硬化甲壳（主角 -15 MP · 艾莲娜 -15 集中）"
    type: "check"
    skill: "perception"
    difficulty: 10
    condition:
      has_item: "照明信号箭"
      min_hp: 1
      min_mp: 15
      variables:
        ally_recruited: true
        ally_hp:
          gt: 0
        boss_armor_broken: false
        boss_defeated: false
    on_success:
      consume_item: "照明信号箭"
      remove_inventory:
        - "照明信号箭"
      hp_delta: -10
      mp_delta: -15
      san_delta: 6
      variables:
        coop_synergy: true
        boss_armor_broken: true
        ally_status: "协同作战"
        ally_last_action: "借照明信号箭连珠三箭破甲(-15集中)"
        boss_casting: "甲壳碎裂 · 伺机蛛网反击（30MP）"
      variables_delta:
        boss_hp: -45
        boss_mp: -20
        ally_hp: -8
        ally_mp: -15
        combat_round: 1
      visuals:
        foreground: ""
        hero_image: "【合作破甲】照明信号箭焚毁巨网！蜘蛛领主腹部软甲暴露（全额100%伤害）"
      message: "全员互攻严格结算：耀眼火光炸裂洞窟！你消耗 15 MP 引爆信号箭，艾莲娜同步消耗 15 集中值发动【迅捷连射】轰碎背甲弱点（Boss -45 HP / -20 MP）；Boss 螯肢横扫余波分别命中你与艾莲娜（你 HP -10；艾莲娜 HP -8）。【甲壳已破】，全队伤害恢复 100%！"
    on_failure:
      hp_delta: -16
      mp_delta: -10
      variables:
        ally_last_action: "破甲箭偏斜并规避毒雾(-10集中)"
      variables_delta:
        ally_hp: -10
        ally_mp: -10
        combat_round: 1
      message: "浓重毒雾干扰了瞄准判定！信号箭未能烧穿主甲壳，Boss 反扑分别波及你与艾莲娜（你 HP -16/MP -10；艾莲娜 HP -10/集中 -10）。"

  - id: "elena_cast_hunters_mark"
    label: "【同伴战技 · 艾莲娜】施放「猎人印记·照明破绽」（艾莲娜 -20 集中值 · 全队检定+2/伤×1.15）"
    type: "check"
    skill: "perception"
    difficulty: 11
    condition:
      min_hp: 1
      variables:
        ally_recruited: true
        ally_hp:
          gt: 0
        ally_mp:
          gte: 20
        ally_mark_active: false
        boss_active: true
        boss_defeated: false
    on_success:
      hp_delta: -12
      variables:
        ally_mark_active: true
        ally_status: "印记锁定中"
        ally_last_action: "猎人印记·照明破绽(-20集中)命中，全队检定+2/伤×1.15"
        boss_casting: "弱点被标记 · 狂怒毒牙反击"
      variables_delta:
        boss_hp: -38
        boss_mp: -15
        ally_hp: -10
        ally_mp: -20
        combat_round: 1
      visuals:
        foreground: ""
        hero_image: "【同伴战技】艾莲娜射出金色猎人印记箭，彻底标记阿拉克诺斯的脆弱毒腺！"
      message: "全员互攻严格结算：艾莲娜消耗 20 集中值执行【猎人印记·照明破绽】感知判定命中，按同伴公式造成 38 点穿刺伤并削减 Boss 15 MP，成功挂上【猎人印记】（全队攻击检定 +2、伤害 ×1.15）！同时你以普攻策应并分担 Boss 反击（你 HP -12；艾莲娜 HP -10）。"
    on_failure:
      hp_delta: -18
      variables:
        ally_last_action: "猎人印记被甲壳弹开(-20集中)"
      variables_delta:
        boss_hp: -12
        ally_hp: -14
        ally_mp: -20
        combat_round: 1
      message: "印记箭擦过紫黑硬壳未能钉入弱点（艾莲娜集中 -20，仅擦伤 Boss 12 HP），蜘蛛领主借机反扫命中你与艾莲娜（你 HP -18；艾莲娜 HP -14）。"

  - id: "elena_frost_interrupt"
    label: "【同伴战技 · 艾莲娜】施放「冰霜震荡箭」打断 Boss 蓄力并清 1 幼蛛（艾莲娜 -25 集中值）"
    type: "check"
    skill: "perception"
    difficulty: 12
    condition:
      min_hp: 1
      variables:
        ally_recruited: true
        ally_hp:
          gt: 0
        ally_mp:
          gte: 25
        boss_active: true
        boss_defeated: false
    on_success:
      hp_delta: -8
      variables:
        ally_status: "冰霜控场"
        ally_last_action: "冰霜震荡箭(-25集中)打断Boss -30MP 并清剿幼蛛"
        boss_casting: "寒冰震荡 · 蓄力中断"
      variables_delta:
        boss_hp: -52
        boss_mp: -30
        boss_minions: -1
        ally_hp: -8
        ally_mp: -25
        combat_round: 1
      visuals:
        foreground: ""
        hero_image: "【同伴控场】冰霜震荡箭冻结蛛王螯肢并轰碎毒囊幼蛛！"

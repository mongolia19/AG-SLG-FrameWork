id: "fargodeep_cave"
title: "洞穴 · 法戈第蛛网矿洞（Boss巢穴）"
background: "【场景全景】阴暗潮湿的废弃矿洞深处，巨型蛛网悬垂于朽坏矿柱之间，幽绿毒雾在洞窟底部翻涌"
foreground: "/assets/characters/elena_swiftarrow.png"
hero_image: "【Boss 特写】法戈第蜘蛛领主·阿拉克诺斯 · 覆满紫黑甲壳与毒腺的巨型蛛王"
music: "/assets/bgm/fargodeep_boss.mp3"

description: |
  穿过前哨碎石拱门，刺骨的阴寒与腐败甜腻的毒雾扑面而来。最深处的巨型岩台上盘踞着令人窒息的巨兽——【蜘蛛领主·阿拉克诺斯（360 HP / 180 MP）】！
  它覆满紫黑色硬化甲壳（未破甲前减免 45% 一切伤害），八只复眼闪烁着残忍的幽绿寒光。战斗将跨越三大阶段：
  · 阶段一（360~241 HP）：施放【甲壳硬化】与【蛛网茧缚（30MP，16伤+缠绕减2）】；
  · 阶段二（240~131 HP）：消耗 35MP【召唤毒囊幼蛛 ×2】并蓄力【剧毒新星（40MP，34伤）】；
  · 阶段三（130~1 HP）：【深渊狂暴】重铸硬壳并引爆【暗影毒液狂潮（45MP，40伤+吸取15MP）】！
  合理分配血量、魔法与打断/破甲时机，方能斩杀蛛王！

visuals:
  background: "【场景全景】阴暗潮湿的废弃矿洞深处，巨型蛛网悬垂于朽坏矿柱之间，幽绿毒雾在洞窟底部翻涌"
  foreground: "/assets/characters/elena_swiftarrow.png"
  hero_image: "【Boss 特写】法戈第蜘蛛领主·阿拉克诺斯 · 覆满紫黑甲壳与毒腺的巨型蛛王"
  atmosphere: "幽暗阴寒、蛛丝密布、杀机四伏"
  decorations:
    - id: "fargodeep_ore_rocks"
      name: "矿洞玄武岩壁"
      image: "/assets/props/rocks.png"
      side: "left"
      category: "env"
      tag: "矿洞地形"
      caption: "潮湿矿石壁"
      tooltip: "残留着铜矿脉与腐蚀蛛液痕迹的深邃洞壁"
    - id: "fargodeep_boss_venom"
      name: "幽暗毒囊结晶"
      image: "/assets/items/venom_crystal.png"
      side: "right"
      category: "env"
      tag: "Boss 毒腺"
      caption: "幽绿毒腺矿簇"
      tooltip: "蜘蛛领主在洞窟深处凝结的剧毒矿簇，散发着危险魔力"

decorations: []

npcs:
  - id: "elena_swiftarrow"
    name: "巡林者艾莲娜·迅箭"
    avatar: "/assets/characters/elena_swiftarrow.png"
    greeting: "Boss 甲壳没破前只能打出 55% 伤害！先破甲、及时清掉幼蛛和挣脱蛛网，再用打断技消耗它的魔法值，千万别硬吃剧毒新星！"

actions:
  - id: "engage_boss_arachnos"
    label: "【唤醒 Boss 战】锁定蜘蛛领主·阿拉克诺斯，展开多阶段决战！"
    type: "interact"
    condition:
      min_hp: 1
      variables:
        boss_active: false
        boss_defeated: false
    on_success:
      variables:
        boss_active: true
        boss_name: "蜘蛛领主·阿拉克诺斯"
        boss_hp: 360
        boss_max_hp: 360
        boss_mp: 180
        boss_max_mp: 180
        boss_phase: 1
        boss_armor_broken: false
        boss_web_trapped: false
        boss_minions: 0
        combat_round: 1
        boss_casting: "【阶段一】甲壳硬化（减伤45%）· 伺机蛛网茧缚（30MP）"
      visuals:
        foreground: "/assets/characters/elena_swiftarrow.png"
        hero_image: "【Boss 战开启】蜘蛛领主·阿拉克诺斯发出嘶鸣，360HP/180MP 压迫降临！"
      remove_hud_widgets:
        - "fargodeep_vanguard"
      hud_widgets:
        - id: "arachnos_boss_panel"
          type: "panel"
          title: "蜘蛛领主·阿拉克诺斯"
          tone: "danger"
          when:
            variables:
              boss_active: true
              boss_defeated: false
          badges:
            - text_ref: "阶段 {variables.boss_phase}/3"
              tone: "amber"
            - text: "✓ 软甲已暴露"
              tone: "emerald"
              when:
                variables:
                  boss_armor_broken: true
            - text: "🛡 甲壳硬化"
              tone: "danger"
              when:
                variables:
                  boss_armor_broken: false
            - text_ref: "毒囊幼蛛 ×{variables.boss_minions}"
              tone: "amber"
              when:
                variables:
                  boss_minions:
                    gt: 0
            - text: "⚠ 蛛网茧缚中"
              tone: "purple"
              when:
                variables:
                  boss_web_trapped: true
            - text_ref: "意图: {variables.boss_casting}"
              tone: "sky"
          bars:
            - label: "Boss 血量"
              value_ref: "variables.boss_hp"
              max_ref: "variables.boss_max_hp"
              color: "rose"
            - label: "Boss 魔法"
              value_ref: "variables.boss_mp"
              max_ref: "variables.boss_max_mp"
              color: "violet"
          cards_title: "查看Boss技能"
          cards:
            - title: "甲壳硬化 (被动/30MP)"
              desc: "未破甲前减免伤害，需合作照明箭或强攻破甲。"
              tone: "danger"
            - title: "蛛网茧缚 (30MP)"
              desc: "缠住冒险者（检定-2），需及时挣脱或火攻烧断。"
              tone: "purple"
            - title: "召唤毒囊幼蛛 (35MP)"
              desc: "二阶段孵化2只幼蛛协同撕咬，干扰命中与施法。"
              tone: "amber"
            - title: "剧毒新星 (40MP)"
              desc: "高伤毒爆蓄力，可趁蓄力间隙打断并反削Boss魔法。"
              tone: "fuchsia"
            - title: "深渊狂暴 (45MP)"
              desc: "低血量三阶段触发，同时腐蚀玩家血量与魔法。"
              tone: "red"
          footer: "战斗公式：玩家技能伤 = (基础威力 + 主属性×2.5 + 技能等级×10) × 破甲(0.55/1.0) × 检定倍率 | Boss MP < 30 进入【魔力枯竭】并蓄力 +35MP | 幼蛛每只 +4 伤(-1检定) · 茧缚 +5 毒伤(-2检定) · 抗毒合剂 -6 毒伤(+1检定)"
      message: "蜘蛛领主·阿拉克诺斯猛地从岩台跃起，紫黑甲壳泛起冷硬幽光！多阶段 Boss 战正式打响（Boss 360 HP / 180 MP），请先破除其硬化甲壳！"

  - id: "use_antidote_before_boss"
    label: "【战前/战中准备】饮用【抗毒合剂】（HP +30 / MP +20，常驻减免6点毒伤）"
    type: "interact"
    condition:
      has_item: "抗毒合剂"
      min_hp: 1
      variables:
        boss_defeated: false
    on_success:
      consume_item: "抗毒合剂"
      remove_inventory:
        - "抗毒合剂"
      hp_delta: 30
      mp_delta: 20
      attributes_delta:
        constitution: 2
      variables:
        antidote_active: true
      message: "清凉的草药灵流流遍全身（HP +30，MP +20，体质 +2），你获得【抗毒护佑】：Boss 每次毒系攻击伤害减免 6 点，检定额外 +1！"

  - id: "coop_clear_webs"
    label: "【合作破甲】消耗【照明信号箭】协同艾莲娜击碎 Boss 硬化甲壳（-15 MP）"
    type: "check"
    skill: "perception"
    difficulty: 10
    condition:
      has_item: "照明信号箭"
      min_hp: 1
      min_mp: 15
      variables:
        ally_recruited: true
        boss_armor_broken: false
        boss_defeated: false
    on_success:
      consume_item: "照明信号箭"
      remove_inventory:
        - "照明信号箭"
      hp_delta: -10
      mp_delta: -15
      san_delta: 6
      variables:
        coop_synergy: true
        boss_armor_broken: true
        boss_casting: "甲壳碎裂 · 伺机蛛网反击（30MP）"
      variables_delta:
        boss_hp: -45
        boss_mp: -20
        combat_round: 1
      visuals:
        foreground: "/assets/characters/elena_swiftarrow.png"
        hero_image: "【合作破甲】照明信号箭焚毁巨网！蜘蛛领主腹部软甲暴露（全额100%伤害）"
      message: "耀眼火光炸裂洞窟！艾莲娜借光连珠三箭精准轰碎蜘蛛领主背甲弱点（Boss HP -45，Boss MP -20；你承受余波 HP -10，MP -15）。【甲壳已破】，后续攻击将造成 100% 全额伤害！"
    on_failure:
      hp_delta: -16
      mp_delta: -10
      variables_delta:
        combat_round: 1
      message: "浓重毒雾遮挡了弹道（HP -16，MP -10），信号箭未能烧穿主甲壳，你们重新锁定角度准备再次破甲。"

  - id: "throw_kobold_bomb_armor"
    label: "【道具破甲】投掷【狗头人火油炸药】炸碎 Boss 硬化甲壳并清场（0 MP）"
    type: "interact"
    condition:
      has_item: "狗头人火油炸药"
      min_hp: 1
      variables:
        boss_armor_broken: false
        boss_defeated: false
    on_success:
      consume_item: "狗头人火油炸药"

      message: "艾莲娜用精准箭矢打断了蜘蛛领主的扑击蓄力！你从容念完咒文，Lv.3 寒冰箭冻结其关节后紧接一发炽烈火球术引爆它体内的可燃毒囊，轰碎了蜘蛛领主·阿拉克诺斯！你晋升【Lv.4】（全属性与技能升级至 Lv.4），掉落【幽暗蛛王丝】与 120 金币！"

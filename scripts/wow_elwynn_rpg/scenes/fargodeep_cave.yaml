      message: "圣光闪现在掌心绽放，瞬间愈合伤势并烧断缠身蛛丝（HP +42，圣能 -25，SAN +4），艾莲娜趁机补箭牵制（Boss -15 HP）！"

  - id: "hunter_arcane_shot"

      message: "艾莲娜率先射断蜘蛛领主左侧步足使其失衡！你借势腾空，Lv.3 奥术射击与毒蛇钉刺化作致命银芒精准贯穿蛛王中枢复眼！蜘蛛领主·阿拉克诺斯轰然倒地！你晋升【Lv.4】（全属性与技能升级至 Lv.4），掉落【幽暗蛛王丝】与 120 金币！"
    on_failure:
      hp_delta: -20
      message: "蜘蛛领主喷吐大片浓雾遮蔽了弹道，螯肢擦伤了你的肩甲（HP -20）。艾莲娜掩护你翻滚脱身，蓄力准备再次齐射！"


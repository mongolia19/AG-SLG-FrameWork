      message: "你用盾牌格挡硬生生扛住蛛王雷霆万钧的扑击，一记雷霆一击震裂地面！艾莲娜箭矢贯穿其腹甲瞬间，你怒吼着劈出 Lv.3 英勇打击，一斧枭首蜘蛛领主·阿拉克诺斯！你晋升【Lv.4】（全属性与技能升级至 Lv.4），掉落【幽暗蛛王丝】与 120 金币！"

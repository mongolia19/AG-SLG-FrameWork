id: "fargodeep_cave"
title: "洞穴 · 法戈第蛛网矿洞"
background: "【场景全景】阴暗潮湿的废弃矿洞深处，巨型蛛网悬垂于朽坏矿柱之间，幽绿毒雾在洞窟底部翻涌"
foreground: "/assets/characters/elena_swiftarrow.png"
hero_image: "【Boss 特写】法戈第蜘蛛领主·阿拉克诺斯 · 覆满紫黑甲壳与毒腺的巨型蛛王"
music: "/assets/bgm/fargodeep_boss.mp3"

description: |
  踏入法戈第矿洞，刺骨的阴寒与腐败甜腻的毒雾扑面而来。原本属于暴风城矿工的木轨早已生锈倾覆，四周岩壁被厚如棉絮的惨白蛛网层层包裹。
  矿洞穹顶倒悬着数以百计的鼓胀蛛卵，最深处的巨型岩台上，盘踞着令人窒息的巨兽——【蜘蛛领主·阿拉克诺斯】。
  它八只复眼闪烁着残忍的幽绿寒光，粗壮螯肢滴落着腐蚀岩石的剧毒。若没有同伴协助破除陷阱并牵制其侧翼，任何单独闯入者都会瞬间沦为蛛网中的猎物！

visuals:
  background: "【场景全景】阴暗潮湿的废弃矿洞深处，巨型蛛网悬垂于朽坏矿柱之间，幽绿毒雾在洞窟底部翻涌"
  foreground: "/assets/characters/elena_swiftarrow.png"
  hero_image: "【Boss 特写】法戈第蜘蛛领主·阿拉克诺斯 · 覆满紫黑甲壳与毒腺的巨型蛛王"
  atmosphere: "幽暗阴寒、蛛丝密布、杀机四伏"
  decorations:
    - id: "fargodeep_ore_rocks"
      name: "矿洞玄武岩壁"
      image: "/assets/props/rocks.png"
      side: "left"
      category: "env"
      tag: "矿洞地形"
      caption: "潮湿矿石壁"
      tooltip: "残留着铜矿脉与腐蚀蛛液痕迹的深邃洞壁"

decorations: []

npcs:
  - id: "elena_swiftarrow"
    name: "巡林者艾莲娜·迅箭"
    avatar: "/assets/characters/elena_swiftarrow.png"
    greeting: "别急着冲上去！先和我配合放出照明信号、清掉洞顶的潜伏蛛网，暴露出蜘蛛领主的腹部弱点后再一起集火！"

actions:
  - id: "coop_clear_webs"
    label: "【洞穴合作 · 第一阶段】与艾莲娜协同释放照明信号箭，焚毁主蛛网并锁定Boss弱点"
    type: "check"
    skill: "perception"
    difficulty: 10
    condition:
      variables:
        ally_recruited: true
        coop_synergy: false
        boss_defeated: false
    on_success:
      consume_item: "照明信号箭"
      remove_inventory:
        - "照明信号箭"
      san_delta: 6
      variables:
        coop_synergy: true
      visuals:
        foreground: "/assets/characters/elena_swiftarrow.png"
        hero_image: "【合作战术】照明火光驱散矿洞黑暗！蜘蛛领主腹部软甲暴露无遗"
      message: "你高举信号箭吸引岩顶幼蛛注意，艾莲娜借着灼热火光连发三箭，瞬间烧穿了笼罩战场的巨型毒网！【合作连携已激活】——蜘蛛领主的腹部软甲彻底暴露，Boss 决战难度大幅下降！"
    on_failure:
      hp_delta: -12
      message: "潮湿的空气延缓了火光扩散，一团粘稠蛛丝差点封住你的左臂（HP -12）。艾莲娜急忙一箭斩断蛛丝，你们重新站稳阵脚，随时可以再次尝试配合破网。"

  - id: "use_antidote_before_boss"
    label: "【战前准备】饮用【抗毒合剂】增强毒抗并恢复体力"
    type: "interact"
    condition:
      has_item: "抗毒合剂"
      variables:
        boss_defeated: false
    on_success:
      consume_item: "抗毒合剂"
      remove_inventory:
        - "抗毒合剂"
      hp_delta: 25
      attributes_delta:
        constitution: 2
      message: "清凉的草药灵流流遍全身（HP +25，体质 +2），法戈第矿洞中的幽绿毒雾瞬间对你失去了侵蚀力！"

  - id: "coop_boss_paladin"
    label: "【合作决战 · 圣骑士】与艾莲娜左右夹击，释放 Lv.3 十字军打击圣光裁决蜘蛛领主！"
    type: "check"
    skill: "strength"
    difficulty: 12
    condition:
      variables:
        class_id: "paladin"
        coop_synergy: true
        boss_defeated: false
    on_success:
      gain_item: "幽暗蛛王丝"
      gold_delta: 120
      hp_delta: 15
      san_delta: 15
      attributes_delta:
        strength: 3
        agility: 2
        intelligence: 3
        constitution: 3
        perception: 2
      variables:
        boss_defeated: true
        level: 4
        xp: 800
        xp_next: 1400
        skill_rank: 4
        skills: "十字军打击 Lv.4 · 圣光闪现 Lv.4 · 虔诚光环 Lv.4（大师级觉醒）"
      visuals:
        hero_image: "【Boss 战胜利】金色圣光轰碎阿拉克诺斯甲壳，珍稀材料散落岩台！"
      message: "艾莲娜的冰霜箭雨稳稳锁住了蜘蛛领主的螯肢！你抓住瞬息破绽，金色战锤挟着 Lv.3 十字军打击怒劈其腹部软甲，轰然终结了蜘蛛领主·阿拉克诺斯！你晋升【Lv.4】（全属性与技能升级至 Lv.4），战利品【幽暗蛛王丝】与 120 金币已收入囊中！"
    on_failure:
      hp_delta: -22
      message: "蜘蛛领主在临死挣扎中甩出毒液尾钩击飞了你的格挡（HP -22）！艾莲娜立刻发射震荡箭逼退巨蛛，你们重整圣光阵型准备下一轮合击！"

  - id: "coop_boss_hunter"

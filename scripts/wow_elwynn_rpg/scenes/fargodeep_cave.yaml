id: "fargodeep_cave"
title: "洞穴 · 法戈第蛛网矿洞（Boss巢穴）"
background: "/assets/scenes/fargodeep_cave.svg"
foreground: ""
hero_image: "/assets/illustrations/fargodeep_cave_hero.svg"
music: "/assets/bgm/fargodeep_boss.mp3"

description: |
  穿过前哨碎石拱门，刺骨的阴寒与腐败甜腻的毒雾扑面而来。最深处的巨型岩台上盘踞着令人窒息的巨兽——【蜘蛛领主·阿拉克诺斯（360 HP / 180 MP）】！
  它覆满紫黑色硬化甲壳（未破甲前减免 45% 一切伤害），八只复眼闪烁着残忍的幽绿寒光。本场战斗严格执行【全员回合制互攻与规则判定】：每回合依次结算【主角行动 → 随行同伴艾莲娜独立技能判定 → Boss 本体与存活幼蛛反击】，绝不跳过任何角色的属性与伤害计算！
  · 阶段一（360~241 HP）：施放【甲壳硬化】与【蛛网茧缚（30MP，单体16伤+缠绕减2）】；
  · 阶段二（240~131 HP）：消耗 35MP【召唤毒囊幼蛛 ×2（40HP×2）】并蓄力【剧毒新星（40MP，全体34毒伤）】；
  · 阶段三（130~1 HP）：【深渊狂暴】重铸硬壳并引爆【暗影毒液狂潮（45MP，全体40伤+吸取双方15MP）】！
  合理统筹你与巡林者艾莲娜的血量、魔力/集中值、猎人印记、破甲与打断时机，方能斩杀蛛王！


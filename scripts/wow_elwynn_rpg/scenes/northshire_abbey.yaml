      visuals:
        hero_image: "【职业觉醒】艾露恩银辉萦绕的暗夜精灵紫杉长弓"
      message: "银月清辉映照你的双眸！你觉醒为【暗夜精灵 · 猎人】，敏捷+5、感知+3、体质+2，掌握初始技能：奥术射击 Lv.1、毒蛇钉刺 Lv.1、猎豹守护 Lv.1。"


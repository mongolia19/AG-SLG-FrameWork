          cost: "15 集中值"
          cooldown: "2 回合"
        - id: "aspect_of_the_cheetah"
          name: "猎豹守护"
          level: 1
          tag: "身法 · 守护"
          desc: "唤醒荒野猎豹的敏捷直觉，保持高度戒备与轻盈步法。"
          effect: "常驻提升闪避反应、先手侦察感知与脱险速度，降低被偷袭风险。"
          cost: "常驻守护"
          cooldown: "持续生效"
      variables:
        class_selected: true
        race: "暗夜精灵"
        class_name: "猎人"
        class_id: "hunter"
        level: 1
        xp: 0
        xp_next: 100
        skill_rank: 1

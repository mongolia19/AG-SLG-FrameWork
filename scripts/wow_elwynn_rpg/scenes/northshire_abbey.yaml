          desc: "凝聚炽热火元素投射爆裂火球，正面轰击敌人或障碍。"
          effect: "造成高额火焰爆发伤害，可瞬间引燃并清扫矿洞蛛网与易燃毒囊。"
          cost: "30 法力值"
          cooldown: "1 回合"
        - id: "frostbolt"
          name: "寒冰箭"
          level: 1
          tag: "冰霜 · 控制"
          desc: "发射极寒冰晶箭刺穿敌人，将凛冽寒气注入目标关节。"
          effect: "造成冰霜伤害并强效减速控制，限制强敌冲锋、打断敌方连招。"
          cost: "20 法力值"
          cooldown: "瞬发"
        - id: "arcane_intellect"
          name: "奥术智慧"
          level: 1
          tag: "奥术 · 增益"
          desc: "激发达拉然奥术符文强化心智，保持清醒专注的魔力感知。"
          effect: "常驻提升智力法术精准度与魔法抗性，减缓毒雾造成的理智（SAN）流失。"
          cost: "常驻增益"
          cooldown: "持续生效"
      variables:

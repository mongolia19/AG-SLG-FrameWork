        race: "侏儒"
        class_name: "法师"
        class_id: "mage"
        level: 1
        xp: 0
        xp_next: 100
        skill_rank: 1
        skills: "火球术 Lv.1 · 寒冰箭 Lv.1 · 奥术智慧 Lv.1"
      visuals:
        hero_image: "【职业觉醒】紫罗兰奥术符文阵与元素火球术法杖"
      message: "奥术星芒在你指尖跃动！你觉醒为【侏儒 · 法师】，智力+5、感知+3、敏捷+2，掌握初始技能：火球术 Lv.1、寒冰箭 Lv.1、奥术智慧 Lv.1。"

  - id: "choose_dwarf_warrior"

id: "northshire_abbey"
title: "新手村 · 北郡修道院"
background: "【场景全景】艾尔文森林·北郡修道院晨光广场，石砌钟楼与圣光旗帜矗立在绿茵山谷之中"
foreground: "/assets/characters/marshal_mcbride.png"
hero_image: "【焦点插画】北郡修道院圣光祭坛与暴风城新兵征召榜"
music: "/assets/bgm/northshire_dawn.mp3"

description: |
  清晨的薄雾正从艾尔文森林苍翠的树梢间散去，北郡修道院高耸的石砌钟楼敲响了晨祷钟声。
  石阶广场上飘扬着蓝金相间的暴风城雄狮战旗，几名神色严峻的卫兵正低声清点着战备补给。
  修道院大门前，治安官麦格布莱德双臂抱胸站在征召榜旁。南方的法戈第矿洞近日频频传出蜘蛛异动与毒雾蔓延的坏消息，
  暴风城急需新的英雄挺身而出——在你踏上艾泽拉斯的冒险之前，必须先觉醒属于自己的种族血脉与职业技艺。

visuals:
  background: "【场景全景】艾尔文森林·北郡修道院晨光广场，石砌钟楼与圣光旗帜矗立在绿茵山谷之中"
  foreground: "/assets/characters/marshal_mcbride.png"
  hero_image: "【焦点插画】北郡修道院圣光祭坛与暴风城新兵征召榜"
  atmosphere: "晨光熹微、庄严肃穆、号角蓄势"
  decorations: []

decorations: []

npcs:
  - id: "marshal_mcbride"
    name: "治安官麦格布莱德"
    avatar: "/assets/characters/marshal_mcbride.png"
    greeting: "圣光保佑你，年轻的冒险者！先选定你的种族与职业之道，再完成北郡新兵试炼吧。切记，法戈第矿洞的蜘蛛领主绝非一人之力可敌。"

actions:
  - id: "choose_human_paladin"
    label: "【开局抉择】人类 · 圣骑士（初始技能：十字军打击/圣光闪现/虔诚光环 Lv.1）"
    type: "interact"
    target_npc: "marshal_mcbride"
    condition:
      variables:
        class_selected: false
    on_success:
      attributes_delta:
        strength: 4
        intelligence: 3
        constitution: 3
        perception: 1
      equip_outfit:
        top:
          id: "paladin_chainmail"
          name: "银白新兵锁甲胸铠"
          desc: "刻有白银之手微记的制式锁甲，兼具防御与圣光导魔性。"
          tag: "圣骑士 · 锁甲"
        accessory:
          id: "silver_hand_libram"
          name: "白银之手训练圣契与战锤"
          desc: "象征圣骑士誓言的入门圣契与战锤，释放圣光技能时隐隐发光。"
          tag: "圣光 · 职业武装"
      skills:
        - id: "crusader_strike"
          name: "十字军打击"
          level: 1
          tag: "近战 · 圣光"
          desc: "将圣光之力灌注战锤重击目标，造成物理与神圣混合伤害。"
          effect: "对亡灵与魔物伤害提升 30%，并提高力量近战破防检定成功率。"
          cost: "20 圣能"
          cooldown: "1 回合"
        - id: "flash_of_light"
          name: "圣光闪现"
          level: 1
          tag: "治疗 · 圣光"
          desc: "快速引导温和圣光愈合自身或同伴伤势，稳定战斗续航。"
          effect: "立即恢复自身或队友 25~35 点生命值，并安抚心智（SAN +3）。"
          cost: "25 圣能"
          cooldown: "2 回合"
        - id: "devotion_aura"
          name: "虔诚光环"
          level: 1
          tag: "守护 · 光环"
          desc: "展开白银之手神圣防御力场，持续守护自身与身旁同伴。"
          effect: "常驻减免 20% 物理与毒素冲击伤害，提升正面抗压与体质检定表现。"
          cost: "常驻光环"
          cooldown: "持续生效"
      variables:
        class_selected: true
        race: "人类"
        class_name: "圣骑士"
        class_id: "paladin"
        level: 1
        xp: 0
        xp_next: 100
        skill_rank: 1
        skills: "十字军打击 Lv.1 · 圣光闪现 Lv.1 · 虔诚光环 Lv.1"
      visuals:
        hero_image: "【职业觉醒】白银之手圣光照耀人类圣骑士徽记"
      message: "圣光在你掌心燃起温暖金芒！你觉醒为【人类 · 圣骑士】，力量+4、智力+3、体质+3，掌握初始技能：十字军打击 Lv.1、圣光闪现 Lv.1、虔诚光环 Lv.1。"

  - id: "choose_nightelf_hunter"
    label: "【开局抉择】暗夜精灵 · 猎人（初始技能：奥术射击/毒蛇钉刺/猎豹守护 Lv.1）"
    type: "interact"
    target_npc: "marshal_mcbride"

      message: "铁炉堡的山丘之力在你血脉中奔涌！你觉醒为【矮人 · 战士】，力量+4、体质+5、敏捷+1，掌握初始技能：英勇打击 Lv.1、雷霆一击 Lv.1、盾牌格挡 Lv.1。"

  - id: "talk_mcbride_quest"
    label: "向治安官麦格布莱德请命，接取《清剿法戈第蛛灾》任务并领取军饷"
    type: "interact"
    target_npc: "marshal_mcbride"
    condition:
      variables:
        class_selected: true
        mcbride_quest_accepted: false
    on_success:
      gold_delta: 20
      gain_item: "北郡军令状"
      variables:
        mcbride_quest_accepted: true
      visuals:
        foreground: "/assets/characters/marshal_mcbride.png"
      message: "麦格布莱德将盖有暴风城火漆的【北郡军令状】与 20 枚金币交到你手中：‘先在修道院外围磨炼技能，再前往艾尔文野外与斥候艾莲娜汇合！只有两人配合，才能拿下矿洞深处的蜘蛛领主！’"

  - id: "northshire_wolf_trial"
    label: "【新手试炼】运用初始技能清剿修道院外围灰狼与狗头人斥候"
    type: "check"
    skill: "perception"
    difficulty: 9
    condition:
      variables:
        class_selected: true
        northshire_trial_done: false
    on_success:
      xp: 100
      hp_delta: -6
      gold_delta: 15
      gain_item: "狗头人蜡烛碎块"
      variables:
        northshire_trial_done: true
        xp: 100
      visuals:
        foreground: ""
        hero_image: "【战斗特写】修道院林边击溃偷蜡烛的狗头人斥候"
      message: "你果断施展 Lv.1 初始职业技能，漂亮地击退了潜伏在修道院篱笆旁的森林灰狼与狗头人斥候！积累了宝贵战斗经验（XP +100），现在可以找治安官麦格布莱德突破等级了！"
    on_failure:
      hp_delta: -12
      message: "狗头人趁你收招间隙挥舞矿镐偷袭，划伤了你的手臂（HP -12）。调整呼吸后你可以再次发起清剿。"

  - id: "upgrade_to_lv2"
    label: "【等级突破 Lv.1 → Lv.2】向麦格布莱德汇报战果，全面提升属性与技能等级"
    type: "interact"
    target_npc: "marshal_mcbride"
    condition:
      variables:
        class_selected: true
        northshire_trial_done: true
        level: 1
    on_success:
      hp_delta: 25
      san_delta: 5
      attributes_delta:
        strength: 2
        agility: 2
        intelligence: 2
        constitution: 2
        perception: 2
      variables:
        level: 2
        xp: 100
        xp_next: 300
        skill_rank: 2
        skills: "初始职业三技能全面晋升至 Lv.2（威力提升 35%，冷却缩短）"
      visuals:
        foreground: "/assets/characters/marshal_mcbride.png"
        hero_image: "【等级跃升】金光涌动！角色晋升 Lv.2，全属性提升，技能迈入 Lv.2"
      message: "麦格布莱德满意地点了点头，亲自指点你发力与施法的窍门！你成功晋升至【Lv.2】！全基础属性 +2、生命恢复，所有初始职业技能正式突破至【Lv.2】！"

  - id: "drink_healing_potion_village"
    label: "饮用随身携带的【初级治疗药水】恢复生命值"
    type: "interact"
    condition:
      has_item: "初级治疗药水"
    on_success:
      consume_item: "初级治疗药水"
      remove_inventory:
        - "初级治疗药水"
      hp_delta: 40
      message: "甘甜而温暖的炼金药液顺喉而下，身上的擦伤迅速愈合（HP +40）。"

  - id: "turn_in_boss_materials"
    label: "【凯旋交差】向麦格布莱德呈交蜘蛛领主掉落材料，锻造暴风城英雄披风"
    type: "interact"
    target_npc: "marshal_mcbride"
    condition:
      has_item: "幽暗蛛王丝"
      variables:
        boss_defeated: true
        quest_completed: false
    on_success:
      consume_item: "幽暗蛛王丝"
      remove_inventory:
        - "幽暗蛛王丝"
      gold_delta: 150
      san_delta: 10
      equip_outfit:
        outer:
          id: "stormwind_hero_cloak"
          name: "蛛丝织锦·暴风城守望者披风"
          desc: "由幽暗蛛王丝与暴风城金线混纺而成的稀有披风，刀剑难伤、剧毒不侵。"
          tag: "史诗掉落打造 · 外套"
      variables:
        quest_completed: true
      visuals:
        foreground: "/assets/characters/marshal_mcbride.png"
        hero_image: "【史诗成就】艾尔文英雄归来！法戈第矿洞危机彻底解除"
      message: "麦格布莱德接过珍贵的【幽暗蛛王丝】，高声赞叹你的勇武！修道院工匠连夜为你织就【蛛丝织锦·暴风城守望者披风】并赏赐 150 金币。北郡的钟声为你而鸣，艾泽拉斯记住了你的名字！"

  - id: "go_to_wilds"
    label: "沿艾尔文大道南下，前往【野外 · 艾尔文密林与哨岗】"
    type: "transition"
    target_scene: "elwynn_wilds"
    condition:
      variables:
        class_selected: true

          effect: "造成高倍率破甲近战伤害，有效劈碎野兽厚皮与巨蛛硬壳。"
          cost: "20 怒气值"
          cooldown: "1 回合"
        - id: "thunder_clap"
          name: "雷霆一击"
          level: 1
          tag: "震荡 · 群攻"
          desc: "重踏地面激起雷霆冲击波，向四周扩散强劲震荡气浪。"
          effect: "震慑周遭敌群并强行打断扑击节奏，压制群体敌人的攻击频次。"
          cost: "25 怒气值"
          cooldown: "2 回合"
        - id: "shield_block"

        class_selected: false
    on_success:
      attributes_delta:
        strength: 4
        constitution: 5
        agility: 1
        perception: 1
      equip_outfit:
        top:
          id: "ironforge_breastplate"
          name: "铁炉堡锻钢重胸甲"
          desc: "由黑铁砧炉锤炼百次的厚实板甲，能硬生生弹开野兽利爪。"
          tag: "战士 · 板甲"
        accessory:
          id: "dwarven_warshield"
          name: "铁炉堡橡木镶铁战盾与战斧"
          desc: "沉稳厚重的矮人防具，配有一柄顺手的单手战斧。"
          tag: "盾战 · 职业武装"
      skills:
        - id: "heroic_strike"
          name: "英勇打击"
          level: 1

id: "wow_elwynn_rpg"
title: "艾泽拉斯传说：法戈第矿洞之影"
version: "1.1.0"
author: "AG-SLG Studio Co-pilot"
icon: "⚔️"
sort_order: 20
initial_scene: "northshire_abbey"
opening_narration: |
  晨祷钟声在艾尔文森林的薄雾中回荡，北郡修道院的石砌广场上战旗猎猎。
  作为艾泽拉斯的新兵，法戈第矿洞的危机正等待着你去平息！请先选择你的种族与职业之道，觉醒血量与能量槽位。
dm_rules: |
  - 【战斗伤害与职业公式】：玩家基础技能伤害 = (技能基础威力 + 主属性×2.5 + 技能等级×10)；若 Boss 处于甲壳硬化状态（`boss_armor_broken == false`），伤害须乘以 0.55（向上取整）。
  - 【蜘蛛领主三阶段机制（必须严格遵守 Boss 魔法规则与状态流转）】：
    1. 阶段一（Boss HP 360–241）：施放【甲壳硬化】（减伤45%）与【蛛网茧缚】（需 Boss MP >= 30，消耗 30 MP，造成 16 伤并置 `boss_web_trapped: true`）。
    2. 阶段二（Boss HP <= 240 且 > 130）：进入阶段二时置 `boss_phase: 2`、若 `boss_mp >= 35` 消耗 35 MP 召唤 2 只毒囊幼蛛（`boss_minions: 2`）并蓄力【剧毒新星】（需 Boss MP >= 40，40 MP / 34 伤）。
    3. 阶段三（Boss HP <= 130）：进入阶段三时置 `boss_phase: 3`、消耗 45 MP 触发【深渊狂暴】并重铸甲壳（`boss_armor_broken: false`），施放【暗影毒液狂潮】（40 伤 + 吸取玩家 15 MP）。
    4. 魔力枯竭（Boss MP < 30）：Boss 无法施放高耗能技能（如蛛网茧缚/召唤幼蛛/剧毒新星），进入【魔力枯竭】状态仅能普攻，并每回合自动蓄力恢复 +35 MP。
    5. 战斗修正：每只存活幼蛛增加 4 点毒伤并带来 -1 检定修正；`boss_web_trapped: true` 增加 5 点毒伤并带来 -2 检定修正；`antidote_active: true` 固定减免 6 点毒伤并带来 +1 检定修正。
    6. 击败 Boss 后（`boss_hp <= 0`）：置 `boss_hp: 0, boss_mp: 0, boss_active: false, boss_defeated: true`，晋升 Lv.4（`level: 4, xp: 800, xp_next: 1400, skill_rank: 4, max_hp_delta: 30, max_mp_delta: 30`），掉落【幽暗蛛王丝】并通过 `remove_hud_widgets: ["arachnos_boss_panel"]` 撤除 Boss 战面板。
  - 【AG-UI 专属界面调度】：进入前哨/Boss 战时请通过 `hud_widgets` 展示与更新追踪器或 Boss 面板，战斗结束时通过 `remove_hud_widgets` 及时撤除。

attribute_labels:
  strength: "力量"
  agility: "敏捷"
  intelligence: "智力"
  constitution: "体质"
  perception: "感知"

variable_bounds:
  boss_hp:
    min: 0
    max_var: "boss_max_hp"
  boss_mp:
    min: 0
    max_var: "boss_max_mp"
  boss_minions:
    min: 0
    max: 6
  combat_round:
    min: 0


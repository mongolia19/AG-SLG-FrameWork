  幽暗蛛王丝:
    name: "幽暗蛛王丝"
    icon: "/assets/items/spider_silk.png"
    desc: "蜘蛛领主阿拉克诺斯覆灭后遗留的稀有暗紫韧丝，可交予修道院工匠打造英雄披风。"
  纯净毒囊结晶:
    name: "纯净毒囊结晶"
    icon: "/assets/items/venom_crystal.png"
    desc: "凝结了法戈第深处魔力的幽蓝毒腺结晶，炼金师梦寐以求的珍材。"
  暗牙护符:
    name: "阿拉克诺斯暗牙护符"
    icon: "/assets/items/fang_charm.png"
    desc: "用蜘蛛领主主螯牙雕琢而成的稀有护符，可佩戴在颈部提升敏锐感知。"
  arachnos_fang_charm:
    name: "阿拉克诺斯暗牙护符"
    icon: "/assets/items/fang_charm.png"
    desc: "用蜘蛛领主最坚硬的一对主螯牙雕琢而成的稀有颈饰，隐隐散发威压。"

adjudication_rules:
  - when:
      variables:
        antidote_active: true
    mod: 1
    label: "抗毒合剂护佑(+1)"
  - when:
      variables:
        coop_synergy: true
        boss_active: true
    mod: 1
    label: "艾莲娜协同(+1)"
  - when:
      variables:
        boss_active: true
        boss_web_trapped: true
    mod: -2
    label: "蛛网茧缚干扰(-2)"
  - when:
      variables:
        boss_active: true
        boss_minions:
          gt: 0
    mod: -1
    label: "幼蛛群干扰(-1)"

default_fallback:
  branches:
    - when:
        variables:
          boss_active: true
          boss_defeated: false
      narration: |
        洞穴中回荡着蜘蛛领主的尖锐嘶鸣！你谨慎地尝试【{clean_action}】，同时紧盯阿拉克诺斯紫黑甲壳与毒腺的每一次波动。
      delta:
        variables_delta:
          combat_round: 1
  narration: |
    你在艾尔文森林的晨光与战鼓余韵中尝试【{clean_action}】。前方风声与战意仍在等待你的下一步抉择。
  delta: {}


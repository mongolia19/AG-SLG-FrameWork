adjudication_rules:
  - when:
      variables:
        antidote_active: true
    mod: 1
    label: "抗毒合剂护佑(+1)"
  - when:
      variables:
        ally_recruited: true
        ally_hp:
          gt: 0
        coop_synergy: true
        boss_active: true
    mod: 1
    label: "艾莲娜存活协同(+1)"
  - when:
      variables:
        ally_recruited: true
        ally_hp:
          gt: 0
        ally_mark_active: true
    mod: 2
    label: "艾莲娜·猎人印记破绽(+2)"
  - when:
      variables:
        ally_recruited: true
        ally_hp:
          lte: 0
        boss_active: true
    mod: -1
    label: "同伴重伤力竭·孤军牵制(-1)"
  - when:
      variables:
        ally_recruited: true
        ally_web_trapped: true
        boss_active: true
    mod: -1
    label: "艾莲娜蛛网受困·火力受阻(-1)"
  - when:
      variables:
        boss_active: true
        boss_web_trapped: true
    mod: -2
    label: "蛛网茧缚干扰(-2)"
  - when:
      variables:
        boss_active: true
        boss_minions:
          gt: 0
    mod: -1
    label: "幼蛛群干扰(-1)"
  - skill_in:
      - "constitution"
    when:
      variables:
        class_id: "paladin"
    mod: 1
    label: "虔诚光环护体(+1)"
  - skill_in:
      - "agility"
      - "perception"
    when:
      variables:
        class_id: "hunter"
    mod: 1
    label: "猎豹守护直觉(+1)"
  - skill_in:
      - "intelligence"
    when:
      variables:
        class_id: "mage"
    mod: 1
    label: "奥术智慧增幅(+1)"

default_fallback:
  branches:
    - when:
        variables:
          boss_active: true
          boss_defeated: false
      narration: |
        洞穴中回荡着蜘蛛领主的尖锐嘶鸣！你谨慎地尝试【{clean_action}】，同时紧盯阿拉克诺斯紫黑甲壳、魔力波动与随行同伴艾莲娜的站位配合，严格等待下一轮全员攻防判定。
      delta:
        variables_delta:
          combat_round: 1
  narration: |
    你在艾尔文森林的晨光与战鼓余韵中尝试【{clean_action}】。前方风声与战意仍在等待你的下一步抉择。
  delta: {}

